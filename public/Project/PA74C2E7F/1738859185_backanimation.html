<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="nb_backanimation"></div>
    <script>
      function getRandomColor() {
        let r = Math.floor(Math.random() * 256);
        let g = Math.floor(Math.random() * 256);
        let b = Math.floor(Math.random() * 256);
        return `rgb(${r}, ${g}, ${b})`;
      }
      let containerStyles = `
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-wrap: wrap;
            gap: 2px; 
            background-color: #000000;
            overflow: hidden;
        `;
      let an = document.getElementById("nb_backanimation");
      an.setAttribute("style", containerStyles);
      for (let j = 1; j <= 500; j++) {
        var div = document.createElement("div");
        div.classList.add("square");
        div.style.width = "calc(5% - 2px)";
        div.style.aspectRatio = "1/1";
        div.style.backgroundColor = "#131212";
        div.style.zIndex = "0";
        div.style.transition = "0.3s";
        div.style.borderRadius = "3px";

        an.appendChild(div);
      }

      let squares = document.querySelectorAll(".square");

      squares.forEach((square, index) => {
        square.addEventListener("mouseenter", function () {
          let bgColor = getRandomColor();
          let boxShadowColor = getRandomColor();
          square.style.backgroundColor = bgColor;
          square.style.boxShadow = `0 0 60px ${boxShadowColor}`;
          console.log(index);
        });
        square.addEventListener("mouseleave", function () {
          square.style.backgroundColor = "#131212";
          square.style.boxShadow = "none";
          square.style.zIndex = "0";
          //   _______________
        });
        square.addEventListener("mouseover", () => {
          square.style.zIndex = "5";
        });
      });
    </script>
  </body>
</html>
